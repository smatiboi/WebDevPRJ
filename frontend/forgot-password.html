<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Reset · FLMS</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body data-page="forgot">
  <main class="auth-layout">
    <section class="auth-panel">
      <div class="brand"><span class="brand-mark">F</span><span>FLMS</span></div>
      <h1>Password reset</h1>
      <div id="message" class="message hidden"></div>
      <form id="forgotForm" class="grid">
        <label>Email<input name="email" type="email" required></label>
        <button type="submit">Generate Reset Token</button>
      </form>
      <form id="resetForm" class="grid section">
        <label>Token<input name="token" required></label>
        <label>New Password<input name="password" type="password" minlength="8" required></label>
        <button type="submit" class="secondary">Update Password</button>
      </form>
      <p><a href="/login.html">Back to login</a></p>
    </section>
    <section class="auth-art"><h1>Recover access without calling the circulation desk.</h1></section>
  </main>
  <script src="/assets/js/app.js?v=owner6"></script>
</body>
</html>
