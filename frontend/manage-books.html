<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalog Management · FLMS</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body data-page="manageBooks">
  <div class="app-shell">
    <aside class="sidebar"><div class="brand"><span class="brand-mark">F</span><span>FLMS</span></div><nav id="nav" class="nav"></nav></aside>
    <main class="main">
      <header class="topbar"><div><h1>Catalog Management</h1><p class="subtitle">Add, edit, soft-delete, and bulk import books.</p></div><span id="whoami" class="pill"></span></header>
      <div id="message" class="message hidden"></div>
      <section class="card section" style="padding:18px">
        <form id="bookForm" class="grid cols-3">
          <label>Title<input name="title" required></label>
          <label>Author<input name="author" required></label>
          <label>ISBN<input name="isbn" required></label>
          <label>Publisher<input name="publisher"></label>
          <label>Publication Year<input name="publicationYear" type="number" min="1000" max="2100"></label>
          <label>Category<select name="categoryId" data-categories></select></label>
          <label>Format<select name="format"><option value="physical">Physical</option><option value="digital">Digital</option></select></label>
          <label>Total Copies<input name="totalCopies" type="number" min="1" value="1" required></label>
          <label>Available Copies<input name="availableCopies" type="number" min="0" value="1" required></label>
          <label>Shelf Location<input name="shelfLocation"></label>
          <label>Cover Image URL<input name="coverImage"></label>
          <label>Tags<input name="tags" placeholder="sql, web, research"></label>
          <label style="grid-column:1/-1">Description<textarea name="description"></textarea></label>
          <button type="submit">Save Book</button>
        </form>
      </section>
      <section class="card section" style="padding:18px">
        <form id="importForm" class="grid cols-2">
          <label>CSV File<input name="file" type="file" accept=".csv"></label>
          <button type="submit">Bulk Import</button>
        </form>
      </section>
      <section class="card table-wrap"><table><thead><tr><th>Book</th><th>Author</th><th>Format</th><th>Copies</th><th>Actions</th></tr></thead><tbody id="manageBooksTable"></tbody></table></section>
    </main>
  </div>
  <script src="/assets/js/app.js?v=owner6"></script>
</body>
</html>
